<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetheria Test Suite — Automated Architecture Verification</title>
  <style>
    :root {
      --bg: #07090e;
      --card: rgba(15, 23, 42, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --cyan: #00f2fe;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      padding: 32px;
      line-height: 1.5;
    }
    .header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    .header h1 {
      font-size: 1.6rem;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }
    .summary-card {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 24px;
    }
    .stat {
      display: flex;
      flex-direction: column;
    }
    .stat-val {
      font-size: 1.6rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .stat-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }
    .stat-pass .stat-val { color: var(--green); }
    .stat-fail .stat-val { color: var(--red); }
    .stat-total .stat-val { color: var(--cyan); }
    .suite-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .suite-header {
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-item {
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.92rem;
    }
    .test-item:last-child { border-bottom: none; }
    .badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-pass { background: rgba(16, 185, 129, 0.2); color: var(--green); border: 1px solid var(--green); }
    .badge-fail { background: rgba(239, 68, 68, 0.2); color: var(--red); border: 1px solid var(--red); }
    .test-error {
      color: var(--red);
      font-family: monospace;
      font-size: 0.82rem;
      margin-left: auto;
    }
    .test-duration {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-left: auto;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🧪 Aetheria Architecture Test Suite (v1.7.0)</h1>
    <p>Verificación Automatizada de 5 Vectores: Contratos, Catálogo de Errores, Autómata de UI, Cinemática y Resiliencia.</p>
  </div>

  <div class="summary-card">
    <div class="stat stat-total">
      <span class="stat-val" id="stat-total">0</span>
      <span class="stat-label">Total Pruebas</span>
    </div>
    <div class="stat stat-pass">
      <span class="stat-val" id="stat-pass">0</span>
      <span class="stat-label">Aprobadas</span>
    </div>
    <div class="stat stat-fail">
      <span class="stat-val" id="stat-fail">0</span>
      <span class="stat-label">Fallidas</span>
    </div>
    <div class="stat">
      <span class="stat-val" id="stat-time">0 ms</span>
      <span class="stat-label">Tiempo Total</span>
    </div>
  </div>

  <div id="test-results"></div>

  <!-- Carga de módulos de la aplicación para testing -->
  <script src="../js/contracts.js?v=1.8.5"></script>
  <script src="../assets/palettes.js?v=1.8.5"></script>
  <script src="../js/state.js?v=1.8.5"></script>
  <script src="../js/extensions/backgrounds.js?v=1.8.5"></script>
  <script src="../js/original/fluidCore.js?v=1.8.5"></script>
  <script src="../js/extensions/particleFx.js?v=1.8.5"></script>
  <script src="../js/extensions/customCursor.js?v=1.8.5"></script>
  <script src="../js/extensions/swarmEngine.js?v=1.8.5"></script>
  <script src="../js/extensions/symmetry.js?v=1.8.5"></script>
  <script src="../js/extensions/fidgets.js?v=1.8.5"></script>
  <script src="../js/extensions/sandMode.js?v=1.8.5"></script>
  <script src="../js/extensions/recorder.js?v=1.8.5"></script>
  <script src="../js/extensions/ui.js?v=1.8.5"></script>

  <!-- Suite de Pruebas -->
  <script src="aetheria_spec.js?v=1.8.5"></script>
</body>
</html>
